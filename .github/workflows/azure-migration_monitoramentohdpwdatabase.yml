# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Fluxo: push na azure-migration → verificações → build → deploy → saúde.
# Qualquer falha antes do deploy impede a publicação.
# Executar manualmente (workflow_dispatch) em outra branch roda só as
# verificações e o build: o deploy acontece apenas a partir da azure-migration.

name: Build and deploy Node.js app to Azure Web App - monitoramentohdpwdatabase

on:
  push:
    branches:
      - azure-migration
  workflow_dispatch:

# Serialize production deployments without interrupting a deployment in progress.
concurrency:
  group: azure-monitoramentohdpwdatabase-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read #This is required for actions/checkout
    # Registra cada deploy em Settings → Environments → production (histórico e link).
    environment:
      name: ${{ github.ref == 'refs/heads/azure-migration' && 'production' || 'verification' }}
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '26.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency URL policy
        run: npm run audit:package-links

      - name: Check server syntax
        run: npm run check:syntax

      - name: Type check frontend
        run: npm run typecheck

      # Roda todos os scripts/test-*.mjs (testes novos entram automaticamente).
      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          VITE_TEAMS_AGENT_URL: "https://teams.microsoft.com/l/app/?source=agent-details-page&sharedAppResource=TaosSharedApp&titleId=T_2a558888-08cb-4cfa-dc1d-4089d17e6e39"

      # Pacote enxuto (dist, server, api, dependências de produção): ~48 MB
      # em vez da pasta inteira com dependências de desenvolvimento.
      - name: Prepare deploy package
        run: node scripts/prepare-deploy.mjs

      # O pacote precisa subir sozinho antes de ir para produção.
      - name: Smoke test deploy package
        working-directory: deploy
        env:
          PORT: '18080'
          NODE_ENV: production
          DB_HOST: 127.0.0.1
          DB_NAME: smoke
          DB_USER: smoke
          DB_PASSWORD: smoke
          DB_SSL: 'false'
        run: |
          npm start > smoke.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:18080/api/auth/saml/config && curl -sf -o /dev/null http://127.0.0.1:18080/; then
              echo "Pacote sobe corretamente."; kill %1; rm -f smoke.log; exit 0
            fi
            sleep 1
          done
          cat smoke.log
          echo "::error::O pacote de deploy não subiu localmente."
          exit 1

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        if: github.ref == 'refs/heads/azure-migration'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'monitoramentohdpwdatabase'
          slot-name: 'Production'
          package: deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_C9D0CCD4C1644AFC8D0C641B43C80A09 }}

      # Confirma que o painel voltou e conversa com o banco (/api/health).
      # O App Service pode levar alguns minutos para reiniciar: espera até 12 min.
      - name: Verify deployment health
        if: github.ref == 'refs/heads/azure-migration'
        env:
          APP_URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
        run: |
          started=$(date +%s)
          for attempt in $(seq 1 48); do
            status=$(curl -s -o health.json -w '%{http_code}' --max-time 20 "$APP_URL/api/health" || true)
            elapsed=$(( $(date +%s) - started ))
            if [ "$status" = "200" ]; then
              echo "Painel saudável após ${elapsed}s (tentativa $attempt): $(cat health.json)"
              echo "::notice::Painel voltou ${elapsed}s após o deploy."
              exit 0
            fi
            echo "Tentativa $attempt (${elapsed}s): HTTP $status; aguardando o App Service reiniciar..."
            sleep 15
          done
          echo "::error::O painel não respondeu 200 em /api/health 12 minutos após o deploy."
          exit 1
